name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'evaluation/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  pytest:
    name: Judge unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # The project's full dependency set includes sibling-repo path deps
      # (nemo-retriever) that don't exist in CI, so install only the light deps
      # the standalone judge + tests need, and skip installing the project
      # itself with --no-project.
      - name: Create virtual environment
        run: uv venv --python 3.12

      - name: Install test dependencies
        run: uv pip install pytest pandas pydantic python-dotenv

      - name: Run tests
        run: uv run --no-project pytest
