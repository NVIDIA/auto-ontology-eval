name: Python Lint and Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'ontology_sql_eval/**'
      - 'main.py'

jobs:
  lint_and_format:
    name: Ruff Check & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.15.9'
          args: check
          src: './ontology_sql_eval'

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.15.9'
          args: format --check
          src: './ontology_sql_eval'
