hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +config_paths=[/Users/yshkolar/Dev/ontology-sql-eval/resources_servers/schema_only_sql/configs/schema_only_sql.yaml,/Users/yshkolar/Dev/ontology-sql-eval/.venv/lib/python3.13/site-packages/responses_api_models/inference_provider/configs/inference_provider.yaml]
    - +agent_name=schema_only_sql_simple_agent
    - +output_jsonl_fpath=runs/control/bird60.jsonl
    - +num_samples_in_parallel=4
    - +split=validation
    - +policy_model_name=aws/anthropic/bedrock-claude-opus-4-8
    - +policy_base_url=https://inference-api.nvidia.com/v1
    - +policy_api_key=sk-q6RvoT5wyTdjvql_bST4VQ
  job:
    name: global_config
    chdir: null
    override_dirname: +agent_name=schema_only_sql_simple_agent,+config_paths=[/Users/yshkolar/Dev/ontology-sql-eval/resources_servers/schema_only_sql/configs/schema_only_sql.yaml,/Users/yshkolar/Dev/ontology-sql-eval/.venv/lib/python3.13/site-packages/responses_api_models/inference_provider/configs/inference_provider.yaml],+num_samples_in_parallel=4,+output_jsonl_fpath=runs/control/bird60.jsonl,+policy_api_key=sk-q6RvoT5wyTdjvql_bST4VQ,+policy_base_url=https://inference-api.nvidia.com/v1,+policy_model_name=aws/anthropic/bedrock-claude-opus-4-8,+split=validation
    id: ???
    num: ???
    config_name: null
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /Users/yshkolar/Dev/ontology-sql-eval
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: nemo_gym
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/yshkolar/Dev/ontology-sql-eval/outputs/2026-09-23/11-36-23
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
