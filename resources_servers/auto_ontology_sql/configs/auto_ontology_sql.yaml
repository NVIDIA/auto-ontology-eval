# Treatment arm: Auto Ontology's ontology-grounded LangGraph agent, wrapped opaquely.
# Graded by the same execution-match verifier as the schema-only control.

auto_ontology_sql_resources_server:
  resources_servers:
    auto_ontology_sql:
      entrypoint: app.py
      datasets_dir: datasets
      # Sized against the model endpoint's rate limit, not CPU. See app.py.
      max_concurrency: 3
      sql_execution_timeout_s: 30.0
      # Question-keyed prompt inputs, off by default. Both change what the
      # agent is told, so switching them on makes this arm no longer comparable
      # to a schema-only control that did not receive the equivalent -- the
      # delta then measures the exemplars and anchors too, not the ontology
      # alone. Enable per run with a Hydra override rather than here, so the
      # committed default stays the comparable one.
      # sql_examples_csv: prompt_inputs/bird/predicted_structural_exemplars.csv
      # sql_examples_k: 5
      # value_anchors_csv: prompt_inputs/bird/value_anchors.csv
      domain: coding
      verified: false
      description: >-
        Ontology-grounded text-to-SQL. Auto Ontology's agent retrieves its own schema,
        join paths and semantic hints; binary reward from unordered result-set
        equality against the same databases as the control arm.
      value: >-
        Measures how much ontology grounding adds over a schema-only baseline.

auto_ontology_sql_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: auto_ontology_sql_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        # `type` is the split gym selects with --split. Use `validation`: the
        # `benchmark` type demands a prepare_script/prompt_config we do not need.
        - name: tasks
          type: validation
          jsonl_fpath: resources_servers/auto_ontology_sql/data/tasks.jsonl
          license: Creative Commons Attribution-ShareAlike 4.0 International
