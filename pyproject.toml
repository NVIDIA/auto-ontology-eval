[project]
name = "ontology-sql-eval"
version = "0.1.0"
description = "LLM-powered re-scoring of Text-to-SQL evaluation CSVs, plus GSF-backed ingestion and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "langchain-nvidia-ai-endpoints",
    "langchain-openai>=1.3.2",
    "pandas>=2.0,<3",
    "pydantic>=2.0",
    "python-dotenv",
    # GSF is imported from the sibling ../GSF checkout via PYTHONPATH (not
    # installed). These mirror ../GSF/pyproject.toml so its runtime deps are in
    # this repo's venv.
    "nemo-retriever[tabular]",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.1",
    "snowflake-connector-python>=4.7.4",
    "databricks-sql-connector>=4.3.0",
    "mysql-connector-python>=26.7.0",
    "kumoai>=2.22.0",
    "langchain-postgres>=0.0.17",
    "duckdb>=1.5.2",
    "pyheavydb>=8.0.1.post1",
    "hvac>=2.4.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Imported directly by bird_interact/bird_interact_http.py. Also reachable
    # transitively through nemo-retriever, but that is an unpinned git HEAD.
    "sqlglot>=30.12.0",
    "importlib-metadata>=9.0.0",
    # gsf.connectors is imported eagerly by gsf.dal/gsf.semantic, and it
    # unconditionally imports every connector module (trino, mysql, kyuubi), so
    # these are required even if a given run never touches those specific
    # connectors.
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "mysql-connector-python>=26.7.0",
    "pyyaml>=6.0.3",
    "trino>=0.339.0",
    "pyhive[hive-pure-sasl]>=0.7.0",
    "thrift>=0.24.0",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6.2",
    "pyjks>=20.0.0",
    # BIRD official EX/VES judge (ontology_sql_eval/judge/bird.py)
    "func-timeout>=4.3.5",
    "numpy>=2.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "huggingface-hub>=1.28.0",
    "psutil>=7.2.2",
]

[project.scripts]
ontology-sql-eval = "ontology_sql_eval.judge.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_sql_eval"]

[tool.uv]
# Force patched versions of transitive dependencies with known CVEs
# (nltk/ray via nemo-retriever, pillow via matplotlib/nemo-retriever).
# Overrides (not constraints) because nemo-retriever pins pillow==12.2.0 exactly.
override-dependencies = [
    "nltk>=3.10.3",
    "pillow>=12.3.0",
    "ray>=2.58.0",
]

[tool.uv.sources]
nemo-retriever = { git = "https://github.com/NVIDIA/NeMo-Retriever.git", subdirectory = "nemo_retriever" }
