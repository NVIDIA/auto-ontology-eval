[project]
name = "ontology-sql-eval"
version = "0.1.0"
description = "LLM-powered re-scoring of Text-to-SQL evaluation CSVs, plus Auto Ontology-backed ingestion and a NeMo Gym benchmark."
readme = "README.md"
# nemo-gym requires >=3.13.14. Raised from >=3.12 when the Gym
# environments were added so the harness and the Gym resources servers can share
# one interpreter.
requires-python = ">=3.13.14,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Auto Ontology's runtime dependencies (connectors, langchain, openai,
    # pandas, fastapi, ...) come in through this package. Do not redeclare them
    # here: a second copy drifts out of sync with what Auto Ontology is tested
    # against. List only what this project needs on top of it.
    "auto-ontology-server @ git+https://github.com/NVIDIA/auto-ontology.git@643993e758459e7bdb72642eed3549eb9d658c9e",
    # Imported directly by bird_interact/bird_interact_http.py. Also reachable
    # transitively through Auto Ontology, but not as part of its contract.
    "sqlglot>=30.12.0",
    # Dataset seeding (scripts/seed_beaverbench.py, scripts/seed_bird_interact.py)
    "datasets>=5.0.1",
    "huggingface-hub>=1.28.0",
    # Charts in scripts/analyze_bird_interact.py
    "matplotlib>=3.11.1",
    "nemo-gym==0.7.0",
]

[project.scripts]
ontology-sql-eval = "ontology_sql_eval.judge.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_sql_eval"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Gym builds each server venv with `uv pip install` run from inside this tree,
# so uv applies these overrides and constraints there too. That is how the
# server venvs get the CVE floors below, so they are listed once, here. Never
# add ray: a ray override replaces Gym's exact `ray[default]==<head version>`
# pin, the server resolves the newest Ray, and it fails to join the head's
# cluster ("Version mismatch"). nemo-gym's own ray[default]>=2.58.0 already
# holds the CVE floor.

# Minimum versions for transitive dependencies with known CVEs. Constraints
# (not overrides) so each package's own upper bounds still apply.
constraint-dependencies = [
    "anyio>=4.15.1",   # BDSA-2026-33862 (via httpx, starlette, openai, mcp)
    "pillow>=12.3.0",  # via matplotlib
    "pyasn1>=0.6.4",   # CVE-2026-59886 (via pyjks, pyasn1-modules)
    "pyjwt>=2.15.1",   # BDSA-2026-35552 (via databricks/snowflake connectors, mcp)
    "urllib3>=2.8.0",  # BDSA-2026-35861, BDSA-2026-35864 (via requests, botocore)
]
