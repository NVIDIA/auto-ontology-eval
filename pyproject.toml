[project]
name = "evaluation-judge"
version = "0.1.0"
description = "LLM-powered re-scoring of Text-to-SQL evaluation CSVs, plus GSF-backed ingestion and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "langchain-nvidia-ai-endpoints",
    "langchain-openai>=1.3.2",
    "pandas>=2.0,<3",
    "pydantic>=2.0",
    "python-dotenv",
    # GSF + NeMo-Retriever runtime deps (mirrors ../GSF/pyproject.toml) so the
    # ingestion and retrieval-eval scripts can run from this repo's venv.
    "nemo-retriever[tabular]",
    "neo4j>=6.1.0",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.1",
    "snowflake-connector-python>=4.6.0",
    "langchain-postgres>=0.0.17",
    "duckdb>=1.5.2",
    "pyheavydb>=8.0.1.post1",
    "hvac>=2.4.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
evaluation-judge = "evaluation_judge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation_judge"]

[tool.uv.sources]
nemo-retriever = { path = "../NeMo-Retriever/nemo_retriever", editable = true }
