[project]
name = "ontology-sql-eval"
version = "0.1.0"
description = "LLM-powered re-scoring of Text-to-SQL evaluation CSVs, plus Auto Ontology-backed ingestion and retrieval evaluation."
readme = "README.md"
# nemo-gym requires >=3.13.14. Raised from >=3.12 when the Gym
# environments were added so the harness and the Gym resources servers can share
# one interpreter.
requires-python = ">=3.13.14,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Auto Ontology's runtime dependencies (connectors, nemo-retriever, langchain,
    # pandas, fastapi, ...) come in through this package. Do not redeclare them
    # here: a second copy drifts out of sync with what Auto Ontology is tested
    # against. List only what this project needs on top of it.
    "auto-ontology-server @ git+https://github.com/NVIDIA/auto-ontology.git@a519b4d1c94f367af416c21360a697b139ff78aa",
    "kumoai>=2.22.0",
    # Imported directly by bird_interact/bird_interact_http.py. Also reachable
    # transitively through Auto Ontology, but not as part of its contract.
    "sqlglot>=30.12.0",
    # BIRD official EX/VES judge (ontology_sql_eval/judge/bird.py)
    "func-timeout>=4.3.5",
    "numpy>=2.0",
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "huggingface-hub>=1.28.0",
    "psutil>=7.2.2",
    "nemo-gym==0.7.0",
]

[project.scripts]
ontology-sql-eval = "ontology_sql_eval.judge.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_sql_eval"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Force patched versions of transitive dependencies with known CVEs
# (nltk via nemo-retriever, pillow via matplotlib/nemo-retriever, urllib3
# via nemo-retriever/requests/botocore).
# Overrides (not constraints) because nemo-retriever pins pillow==12.2.0 and
# urllib3==2.7.0 exactly. An override replaces every other package's range, so
# urllib3 keeps the <3 bound requests and botocore declare.
#
# Never add ray here. Gym builds each server venv with `uv pip install` run
# from inside this tree, so uv applies these overrides there too, and a ray
# override replaces Gym's exact `ray[default]==<head version>` pin. The server
# then resolves the newest Ray and fails to join the head's cluster ("Version
# mismatch"). nemo-gym's own ray[default]>=2.58.0 already holds the CVE floor.
override-dependencies = [
    "nltk>=3.10.3",
    "pillow>=12.3.0",
    "urllib3>=2.8.0,<3",  # BDSA-2026-35861, BDSA-2026-35864
]
# Minimum versions for transitive dependencies flagged by nSpect. Constraints
# (not overrides) so each package's own upper bounds still apply.
constraint-dependencies = [
    "anyio>=4.15.1",   # BDSA-2026-33862 (via httpx, starlette, openai, mcp)
    "pyasn1>=0.6.4",   # CVE-2026-59886 (via pyjks, pyasn1-modules)
    "pyjwt>=2.15.1",   # BDSA-2026-35552 (via databricks/snowflake connectors, mcp)
]
